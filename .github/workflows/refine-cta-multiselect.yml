name: Refine CTA and multiselect
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-cta-multiselect.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Expected block not found: {label}')
              s = s.replace(old, new, 1)

          # CSS: CTAs and multiselection summary
          rep(
            'footer{max-width:var(--max);margin:30px auto 0;padding:0 18px 42px}.footer-inner{border-top:1px solid var(--border);padding:20px 0;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.83rem}.footer-inner a{font-weight:800;color:var(--primary)}\n@media(max-width:820px)',
            'footer{max-width:var(--max);margin:30px auto 0;padding:0 18px 42px}.footer-inner{border-top:1px solid var(--border);padding:20px 0;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.83rem}.footer-inner a{font-weight:800;color:var(--primary)}\n.section-cta{margin-top:18px;padding:16px 17px;border:1px solid var(--border);border-radius:17px;background:linear-gradient(135deg,var(--surface2),var(--surface));display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.section-cta b{display:block;margin-bottom:2px}.section-cta p{margin:0;color:var(--muted);font-size:.87rem;max-width:720px}.section-cta-actions{display:flex;gap:8px;flex-wrap:wrap}.selection-summary{margin-bottom:12px;padding:11px 12px;border:1px solid var(--border);border-radius:14px;background:var(--goldsoft)}.selection-summary b{display:block;font-size:.82rem;margin-bottom:7px}.selection-chips{display:flex;flex-wrap:wrap;gap:6px}.selection-chip{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:var(--surface);border:1px solid var(--border);font-size:.78rem;font-weight:800;color:var(--primary2)}.multi-note{margin-top:8px;color:var(--muted);font-size:.79rem}\n@media(max-width:820px)',
            'css additions'
          )

          # Hero and onboarding copy
          rep(
            '<p>Use o modelo de Robert Plutchik como mapa psicoeducativo: identifique uma emoção, compreenda sua possível função e organize um registro para refletir ou levar à terapia.</p>',
            '<p>Use o modelo de Robert Plutchik como mapa psicoeducativo: identifique uma ou várias emoções que estejam presentes ao mesmo tempo, compreenda suas possíveis funções e organize um registro para refletir ou levar à terapia.</p>',
            'hero copy'
          )
          rep(
            '<div class="step"><div class="step-num">2</div><b>Nomeie</b><span>Use a roda como hipótese. Se outro nome fizer mais sentido, edite.</span></div>',
            '<div class="step"><div class="step-num">2</div><b>Nomeie</b><span>Marque uma ou várias emoções. Elas podem coexistir na mesma experiência; se outro nome fizer mais sentido, edite.</span></div>',
            'step 2 copy'
          )
          rep(
            ' </div>\n</div></section>\n\n<section id="mapa">',
            ' </div>\n <div class="section-cta"><div><b>Pronto para começar?</b><p>Você não precisa encontrar uma emoção “perfeita”. Use a roda como hipótese e marque quantas emoções forem necessárias.</p></div><div class="section-cta-actions"><a class="btn btn-primary" href="#mapa">Começar pela roda</a></div></div>\n</div></section>\n\n<section id="mapa">',
            'howto CTA'
          )

          # Map guidance and CTA
          rep(
            '<div class="section-head"><span class="kicker">Modelo de Plutchik</span><h2>Mapa emocional interativo</h2><p>Oito emoções básicas, três graus qualitativos de intensidade e oito diades primárias entre emoções adjacentes.</p></div>',
            '<div class="section-head"><span class="kicker">Modelo de Plutchik</span><h2>Mapa emocional interativo</h2><p>Oito emoções básicas, três graus qualitativos de intensidade e oito diades primárias entre emoções adjacentes. <strong>Você pode selecionar diferentes emoções simultaneamente</strong> quando elas fizerem parte da mesma experiência.</p></div>',
            'map heading'
          )
          rep(
            '<p class="wheel-help">Clique em um setor ou navegue com Tab + Enter/Espaço. No celular, você também pode usar o seletor abaixo.</p>',
            '<p class="wheel-help"><strong>Multisseleção:</strong> clique em diferentes setores para adicionar emoções ao mesmo registro. Clique novamente em um setor selecionado para removê-lo. No celular, você também pode usar o seletor abaixo.</p>',
            'wheel help'
          )
          rep(
            '<div id="emotionDetails"><p class="details-empty">Selecione uma emoção na roda. A explicação aparecerá aqui sem classificar sua experiência como certa ou errada.</p></div>',
            '<div id="emotionDetails"><p class="details-empty">Selecione uma ou mais emoções na roda. Emoções diferentes podem coexistir na mesma situação; a ferramenta não exige que você escolha apenas uma.</p></div>',
            'details empty'
          )
          rep(
            ' </div>\n </div>\n</div></section>\n\n<section id="registro">',
            ' </div>\n </div>\n <div class="section-cta"><div><b>Mais de uma emoção ao mesmo tempo?</b><p>Isso é esperado. Mantenha selecionados todos os setores que fizerem sentido e leve o conjunto para o registro abaixo.</p></div><div class="section-cta-actions"><a class="btn btn-primary" href="#registro">Levar seleções ao registro</a></div></div>\n</div></section>\n\n<section id="registro">',
            'map CTA'
          )

          # Form labels
          rep(
            '<div class="section-head"><span class="kicker">Diário emocional</span><h2>Registro para levar à terapia</h2><p>Organize um episódio específico. Identificação é opcional e usada apenas na versão para impressão/PDF; ela não entra no histórico.</p></div>',
            '<div class="section-head"><span class="kicker">Diário emocional</span><h2>Registro para levar à terapia</h2><p>Organize um episódio específico. Você pode registrar uma emoção isolada ou várias emoções simultâneas. Identificação é opcional e usada apenas na versão para impressão/PDF; ela não entra no histórico.</p></div>',
            'record heading'
          )
          rep(
            '<div class="field"><label for="emotionName">Emoção</label><input id="emotionName" required placeholder="Selecione na roda ou escreva com suas palavras"><small>Você pode editar o nome sugerido pela roda.</small></div>',
            '<div class="field"><label for="emotionName">Emoção(ões)</label><input id="emotionName" required placeholder="Selecione uma ou várias na roda, ou escreva com suas palavras"><small>As seleções são reunidas automaticamente. Você pode editar o texto final livremente.</small></div>',
            'emotion field'
          )
          rep(
            '<div class="print-meta-item"><span class="print-label">Emoção</span><span class="print-value" id="printEmotion">—</span></div>',
            '<div class="print-meta-item"><span class="print-label">Emoção(ões)</span><span class="print-value" id="printEmotion">—</span></div>',
            'print label'
          )

          # History CTA
          rep(
            '  </article>\n </div>\n</div></section>\n\n<section><div class="share-box">',
            '  </article>\n </div>\n <div class="section-cta"><div><b>O histórico mostrou algo que merece ser explorado?</b><p>Use o padrão como ponto de partida, não como conclusão. Um novo episódio pode trazer contexto que a frequência sozinha não mostra.</p></div><div class="section-cta-actions"><a class="btn btn-primary" href="#registro">Registrar novo episódio</a><a class="btn btn-secondary" href="#mapa">Revisitar a roda</a></div></div>\n</div></section>\n\n<section><div class="share-box">',
            'history CTA'
          )

          # About CTA
          rep(
            ' </div>\n</div></section>\n</main>\n\n<footer>',
            ' </div>\n <div class="section-cta"><div><b>Quer transformar leitura em ação?</b><p>Volte à roda para nomear uma experiência ou use o Guia de Apoio à Saúde Mental para aprofundar outros temas.</p></div><div class="section-cta-actions"><a class="btn btn-primary" href="#mapa">Explorar emoções</a><a class="btn btn-secondary" href="https://ricmurtapsicologia.github.io/Guia-de-Apoio-a-Saude-Mental/">Abrir Guia de Apoio</a></div></div>\n</div></section>\n</main>\n\n<footer>',
            'about CTA'
          )

          # State
          rep('let currentSelection=null;', 'let currentSelections=[];', 'selection state')

          # Replace selection function with true multiselect behavior
          pattern = r'function selectEmotion\(code\)\{.*?\n\}\nfunction feedback'
          new_select = r'''function selectionMeta(code){
 if(code.startsWith("dyad:")){
  const d=DYADS.find(x=>x.code===code.split(":")[1]);
  return d?{code,label:d.label,type:"diad",primaries:[d.a,d.b]}:null
 }
 const [k,ring]=code.split(":"),b=byKey[k];
 return b?{code,label:b[ring],type:"primary",primaryKey:k,ring}:null
}
function selectedLabels(){return currentSelections.map(code=>selectionMeta(code)).filter(Boolean).map(x=>x.label)}
function selectEmotion(code){
 const idx=currentSelections.indexOf(code),adding=idx===-1;
 if(adding)currentSelections.push(code);else currentSelections.splice(idx,1);
 document.querySelectorAll(".wheel-segment").forEach(x=>x.classList.toggle("selected",currentSelections.includes(x.dataset.code)));
 const input=document.getElementById("emotionName"),picker=document.getElementById("mobileEmotion");
 if(picker)picker.value="";
 if(!currentSelections.length){
  input.value="";
  document.getElementById("emotionDetails").innerHTML='<p class="details-empty">Selecione uma ou mais emoções na roda. Emoções diferentes podem coexistir na mesma situação; a ferramenta não exige que você escolha apenas uma.</p>';
  return
 }
 const focusCode=adding?code:currentSelections[currentSelections.length-1],selected=selectedLabels();
 let html="";
 if(focusCode.startsWith("dyad:")){
  const d=DYADS.find(x=>x.code===focusCode.split(":")[1]),a=byKey[d.a],b=byKey[d.b];
  html=`<h3 class="emotion-title">${esc(d.label)}</h3><p class="emotion-meta">Diade primária · ${esc(a.label)} + ${esc(b.label)}</p><div class="details-grid">
   <div class="info-block"><b>Como ler no modelo</b><p>${esc(d.definition)}</p></div>
   <div class="info-block"><b>Uso psicoeducativo</b><p>Trate a diade como uma hipótese de linguagem. Experiências reais podem envolver mais de duas emoções, ambivalência e significados pessoais que a roda não representa.</p></div>
   <div class="info-block"><b>Pergunta útil</b><p>Quais partes de ${esc(a.label.toLowerCase())} e ${esc(b.label.toLowerCase())} aparecem nesta situação, e o que cada uma parece pedir de você?</p></div></div>`;
 }else{
  const [k,ring]=focusCode.split(":"),b=byKey[k],degree=ring==="low"?"baixa":ring==="mid"?"média":"alta";
  html=`<h3 class="emotion-title">${esc(b[ring])}</h3><p class="emotion-meta">${esc(b.label)} · intensidade qualitativa ${degree}</p><div class="details-grid">
   <div class="info-block"><b>Definição funcional</b><p>${esc(b.definition)}</p></div>
   <div class="info-block"><b>Possível função</b><p>${esc(b.function)}</p></div>
   <div class="info-block"><b>Estratégias de regulação</b><ul>${b.strategies.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
   <div class="info-block"><b>Perguntas para reflexão</b><ul>${b.reflections.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>`;
 }
 const summary=`<div class="selection-summary"><b>${selected.length===1?"Emoção selecionada":"Emoções selecionadas simultaneamente"}</b><div class="selection-chips">${selected.map(x=>`<span class="selection-chip">${esc(x)}</span>`).join("")}</div><div class="multi-note">${selected.length>1?"Essas emoções serão reunidas no mesmo registro. Se alguma não fizer mais sentido, clique novamente no respectivo setor para removê-la.":"Você pode continuar selecionando outros setores se mais de uma emoção estiver presente."}</div></div>`;
 document.getElementById("emotionDetails").innerHTML=summary+html+`<p class="model-note">A intensidade indicada pela roda é uma categoria qualitativa do modelo, não uma medida clínica objetiva.</p>`;
 input.value=selected.join(" + ")
}
function feedback'''
          s, n = re.subn(pattern, new_select, s, flags=re.S)
          if n != 1: raise SystemExit(f'selectEmotion replacement count={n}')

          # Record structure: preserve all selected emotions
          pattern = r'function recordFromForm\(\)\{.*?\n\}\nfunction onSubmit'
          new_record = r'''function recordFromForm(){
 const selections=currentSelections.map(code=>selectionMeta(code)).filter(Boolean).map(x=>x.type==="diad"?{code:x.code,label:x.label,type:x.type,primaries:x.primaries}:{code:x.code,label:x.label,type:x.type,primaryKey:x.primaryKey});
 let type="custom",primaryKey=null,primaries=null;
 if(selections.length===1){type=selections[0].type;primaryKey=selections[0].primaryKey||null;primaries=selections[0].primaries||null}
 else if(selections.length>1)type="multi";
 return {id:Date.now()+Math.floor(Math.random()*1000),createdAt:new Date().toISOString(),recordDate:document.getElementById("recordDate").value||null,
 emotionLabel:document.getElementById("emotionName").value.trim(),type,primaryKey,primaries,selections,intensity:document.getElementById("intensity").value,
 context:document.getElementById("context").value.trim(),triggers:document.getElementById("triggers").value.trim(),behavior:document.getElementById("behavior").value.trim(),desired:document.getElementById("desired").value.trim()}
}
function onSubmit'''
          s, n = re.subn(pattern, new_record, s, flags=re.S)
          if n != 1: raise SystemExit(f'recordFromForm replacement count={n}')

          # Graph counts every selected emotion separately
          pattern = r'function renderBars\(\)\{.*?\n\}\nfunction renderAll'
          new_bars = r'''function renderBars(){
 const counts=Object.fromEntries(BASES.map(b=>[b.key,0]));
 const addSelection=sel=>{if(sel.type==="primary"&&sel.primaryKey in counts)counts[sel.primaryKey]+=1;else if(sel.type==="diad"&&Array.isArray(sel.primaries))sel.primaries.forEach(k=>{if(k in counts)counts[k]+=.5})};
 allRecords().forEach(r=>{if(Array.isArray(r.selections)&&r.selections.length)r.selections.forEach(addSelection);else addSelection(r)});
 const max=Math.max(1,...Object.values(counts)),box=document.getElementById("bars");box.innerHTML="";
 BASES.forEach(b=>{const row=document.createElement("div");row.className="bar-row";row.innerHTML=`<span>${esc(b.label)}</span><div class="bar-track"><div class="bar-fill" style="width:${(counts[b.key]/max)*100}%;background:${b.color}"></div></div><b>${counts[b.key]}</b>`;box.append(row)})
}
function renderAll'''
          s, n = re.subn(pattern, new_bars, s, flags=re.S)
          if n != 1: raise SystemExit(f'renderBars replacement count={n}')

          # Clear form resets all selected sectors
          pattern = r'function clearForm\(\)\{.*?\n\}\nfunction summaryText'
          new_clear = r'''function clearForm(){
 document.getElementById("emotionForm").reset();document.getElementById("recordDate").value=new Date().toISOString().slice(0,10);currentSelections=[];document.querySelectorAll(".wheel-segment").forEach(x=>x.classList.remove("selected"));document.getElementById("emotionDetails").innerHTML='<p class="details-empty">Selecione uma ou mais emoções na roda. Emoções diferentes podem coexistir na mesma situação; a ferramenta não exige que você escolha apenas uma.</p>';document.getElementById("mobileEmotion").value=""
}
function summaryText'''
          s, n = re.subn(pattern, new_clear, s, flags=re.S)
          if n != 1: raise SystemExit(f'clearForm replacement count={n}')

          s = s.replace('`Emoção: ${r.emotionLabel}`', '`Emoção(ões): ${r.emotionLabel}`')

          # PDF reading for multiple selections
          pattern = r'function printReadingData\(\)\{.*?\n\}\nfunction buildPrintSheet'
          new_print = r'''function printReadingData(){
 if(!currentSelections.length)return {title:"Emoção nomeada pelo usuário",definition:"A emoção foi registrada com as palavras do usuário, sem associação automática a um setor da roda.",functionText:"Use o rótulo como ponto de partida para explorar contexto, necessidades, valores e padrões em psicoterapia."};
 if(currentSelections.length>1){
  const labels=selectedLabels();
  return {title:`Emoções selecionadas: ${labels.join(" · ")}`,definition:"Este registro reúne diferentes emoções percebidas na mesma experiência. Emoções simultâneas podem coexistir, ter intensidades distintas e apontar para necessidades ou tendências de ação diferentes.",functionText:"No uso psicoeducativo, a multisseleção amplia a linguagem sobre a experiência sem transformar a combinação em diagnóstico ou classificação definitiva."}
 }
 const currentSelection=currentSelections[0];
 if(currentSelection.startsWith("dyad:")){
  const d=DYADS.find(x=>x.code===currentSelection.split(":")[1]),a=byKey[d.a],b=byKey[d.b];
  return {title:d.label,definition:d.definition,functionText:`No modelo de Plutchik, esta diade combina ${a.label.toLowerCase()} e ${b.label.toLowerCase()}. Trate essa combinação como hipótese de linguagem, não como classificação definitiva da experiência.`}
 }
 const [key,ring]=currentSelection.split(":"),b=byKey[key],degree=ring==="low"?"baixa":ring==="mid"?"média":"alta";
 return {title:`${b[ring]} · ${b.label}`,definition:b.definition,functionText:`${b.function} A posição escolhida corresponde a uma intensidade qualitativa ${degree} no modelo.`}
}
function buildPrintSheet'''
          s, n = re.subn(pattern, new_print, s, flags=re.S)
          if n != 1: raise SystemExit(f'printReadingData replacement count={n}')

          # Update metric copy for multiselect
          rep(
            '<article class="card"><h3>Frequência das emoções básicas</h3><p>Registros primários contam 1 ponto. Para visualização, uma diade conta 0,5 para cada emoção que a compõe.</p>',
            '<article class="card"><h3>Frequência das emoções básicas</h3><p>Cada emoção primária selecionada conta 1 ponto. Em registros com múltiplas emoções, cada seleção é contabilizada separadamente. Para visualização, uma diade conta 0,5 para cada emoção que a compõe.</p>',
            'metric copy'
          )

          # Defensive checks
          if 'currentSelection=null' in s:
              raise SystemExit('Legacy currentSelection state remained')
          if 'currentSelection?.startsWith' in s:
              raise SystemExit('Legacy record selection logic remained')

          p.write_text(s, encoding='utf-8')
          PY

          # Remove this one-time workflow from the final repository state.
          rm -f .github/workflows/refine-cta-multiselect.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/refine-cta-multiselect.yml
          git commit -m "Aprimora CTAs e adiciona multisseleção emocional"
          git push
